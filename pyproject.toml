[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-in-farsi"
version = "1.0.0"
description = "Persian AI, natural language processing, and speech recognition resources"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0"
authors = [
    { name = "Danial Pahlavan", email = "danialpahlavan@gmail.com" },
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=7.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
